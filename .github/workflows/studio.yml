name: CGI Studio Pro Pipeline
on: [push]
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg, Fonts & Neural TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pip
          pip install edge-tts --break-system-packages
      - name: Run AI CGI & VFX Director
        run: python3 director.py $(cat topic.txt 2>/dev/null || echo "")
      - name: Upload Finished CGI Video
        uses: actions/upload-artifact@v4
        with:
          name: cgi-studio-video
          path: cgi_studio_final.mp4
