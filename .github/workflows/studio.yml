name: Render Sea Raiders 9x16
on: [push]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg & TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pip
          pip install edge-tts --break-system-packages
      - name: Build Synced 9x16 Documentary
        run: python3 make_video.py
      - name: Upload Vertical Short
        uses: actions/upload-artifact@v4
        with:
          name: sea-raiders-vertical-short
          path: sea_raiders_9x16.mp4
